name: Sync Rules

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merge_rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and Merge Surge Rules
        run: |
          rm -f temp.txt cn_merged.txt v2rayn_cn_direct.json v2rayn_import_rules.json

          # 1. China_All
          curl -sL --retry 3 "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/China/China_All.list" >> temp.txt

          # 2. BiliBili
          curl -sL --retry 3 "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/BiliBili/BiliBili.list" >> temp.txt

          # 3. Alibaba
          curl -sL --retry 3 "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Alibaba/Alibaba_All_No_Resolve.list" >> temp.txt

          # 4. Douyin
          curl -sL --retry 3 "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/DouYin/DouYin.list" >> temp.txt

          # 5. AliPay
          curl -sL --retry 3 "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/AliPay/AliPay.list" >> temp.txt

          # 6. JingDong
          curl -sL --retry 3 "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/JingDong/JingDong.list" >> temp.txt

          # 7. MeiTuan
          curl -sL --retry 3 "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/MeiTuan/MeiTuan.list" >> temp.txt

          # 8. XianYu
          curl -sL --retry 3 "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/XianYu/XianYu.list" >> temp.txt

          # 9. WeChat
          curl -sL --retry 3 "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list" >> temp.txt

          # 10. ChinaIPs
          curl -sL --retry 3 "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/ChinaIPs/ChinaIPs.list" >> temp.txt

          # 11. ChinaIPsBGP
          curl -sL --retry 3 "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/ChinaIPsBGP/ChinaIPsBGP.list" >> temp.txt

          # 生成 Surge 可用规则 cn_merged.txt
          # 处理逻辑：
          # - 删除 Windows 换行符
          # - 修复极少数情况下 no-resolveIP-CIDR 被拼接的问题
          # - 删除注释和空行
          # - 去掉策略字段 DIRECT / REJECT / PROXY
          # - 去重排序
          sed 's/\r$//' temp.txt \
            | sed 's/no-resolveIP-CIDR/no-resolve\nIP-CIDR/g' \
            | sed 's/no-resolveIP-CIDR6/no-resolve\nIP-CIDR6/g' \
            | grep -v '^[[:space:]]*#' \
            | grep -v '^[[:space:]]*$' \
            | sed 's/,DIRECT//g' \
            | sed 's/,REJECT//g' \
            | sed 's/,PROXY//g' \
            | sort -u > cn_merged.txt || true

          echo "Surge 规则生成完成：cn_merged.txt"
          echo "总规则数量："
          wc -l cn_merged.txt

          echo "IP-CIDR 规则数量："
          grep -E '^IP-CIDR,|^IP-CIDR6,' cn_merged.txt | wc -l || true

      - name: Convert Surge Rules to v2rayN JSON
        run: |
          python3 <<'PY'
          import json

          input_file = "cn_merged.txt"

          output_xray_file = "v2rayn_cn_direct.json"
          output_import_file = "v2rayn_import_rules.json"

          domains = set()
          ips = set()

          with open(input_file, "r", encoding="utf-8") as f:
              for raw_line in f:
                  line = raw_line.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  # 删除行内注释
                  if "#" in line:
                      line = line.split("#", 1)[0].strip()

                  if not line:
                      continue

                  parts = [p.strip() for p in line.split(",")]

                  # 标准 Surge 规则，例如：
                  # DOMAIN-SUFFIX,qq.com
                  # DOMAIN,weixin.qq.com
                  # DOMAIN-KEYWORD,bilibili
                  # IP-CIDR,1.0.1.0/24,no-resolve
                  if len(parts) >= 2:
                      rule_type = parts[0].upper()
                      value = parts[1].strip()

                      if not value:
                          continue

                      if rule_type == "DOMAIN-SUFFIX":
                          domains.add(f"domain:{value}")

                      elif rule_type == "DOMAIN":
                          domains.add(f"full:{value}")

                      elif rule_type == "DOMAIN-KEYWORD":
                          domains.add(f"keyword:{value}")

                      elif rule_type == "DOMAIN-REGEX":
                          domains.add(f"regexp:{value}")

                      elif rule_type in ["IP-CIDR", "IP-CIDR6"]:
                          ips.add(value)

                  # 兼容纯域名格式，例如：
                  # qq.com
                  # baidu.com
                  else:
                      if "." in line and "/" not in line:
                          domains.add(f"domain:{line}")

          sorted_domains = sorted(domains)
          sorted_ips = sorted(ips)

          # 1. Xray 原生 routing 格式
          # 这个文件适合手动放进 Xray routing 配置里
          xray_result = {
              "domainStrategy": "AsIs",
              "rules": [
                  {
                      "type": "field",
                      "outboundTag": "direct",
                      "domain": sorted_domains,
                      "ip": sorted_ips
                  }
              ]
          }

          with open(output_xray_file, "w", encoding="utf-8") as f:
              json.dump(xray_result, f, ensure_ascii=False, indent=2)

          # 2. v2rayN 图形界面导入格式
          # 这个文件用于 v2rayN 的：
          # 规则集设置 -> 从文件中导入规则
          import_rules = []

          if sorted_domains:
              import_rules.append({
                  "enabled": True,
                  "remarks": "大陆域名直连",
                  "outboundTag": "direct",
                  "domain": sorted_domains
              })

          if sorted_ips:
              import_rules.append({
                  "enabled": True,
                  "remarks": "大陆IP直连",
                  "outboundTag": "direct",
                  "ip": sorted_ips
              })

          with open(output_import_file, "w", encoding="utf-8") as f:
              json.dump(import_rules, f, ensure_ascii=False, indent=2)

          print(f"Xray routing 规则生成完成：{output_xray_file}")
          print(f"v2rayN 导入规则生成完成：{output_import_file}")
          print(f"domain 数量：{len(sorted_domains)}")
          print(f"ip 数量：{len(sorted_ips)}")
          PY

      - name: Push to Repository
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add cn_merged.txt v2rayn_cn_direct.json v2rayn_import_rules.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update rules: $(date)"
            git push origin main
          fi
